[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85.1"

[lib]
crate-type = ["staticlib"]

# To convert stop!() to panic!(), set RUST_BACKTRACE=1 environment variable.
[profile.release]
lto = "thin"

[build-dependencies]
syn = { version = "3", features = ["full"] }
quote = "1.0"

[dependencies]
roxido = { path="roxido" }
rand = "0.10"
rand_pcg = "0.10"
num-traits = "0.2.15"
dahl-partition = "0.5.7"
dahl-bellnumber = "0.1.4"
dahl-salso = "0.8.0"
rayon = "1.10.0"
ndarray = "0.17.2"
# dbg_step = { path="../../../../rust-dahl-dbg_step" }
